<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form</title>
</head>
<body>
  
    <h2>STUDENT REGISTRATION FORM</h2>
    <FORM>
        <fieldset>
        <label>STUDENT NAME:</label>
        <input type="text" 
        placeholder="Enter your name">
        <br><br>
    
    <label>MOBILE NUMBER:</label>
        <input type="number" 
        placeholder="Enter your mobile number" minlength="10">
        <br><br>
    <label>DOB:</label>
        <input type="date" 
        placeholder="Enter your date of birth"
        minlength="5" maxlength="20">
        <br><br>
         <label>EMAIL ID:</label>
        <input type="email" 
        placeholder="Enter your email">
        <br><br>
   
    <label>PASSWORD:</label>
        <input type="password" 
        placeholder="Enter your password">
        <br><br>
        <p>SELECT YOUR SKILL</p>
        <label>C++</label>
        <input type="checkbox">
         <label>PYTHON</label>
        <input type="checkbox">
         <label>JAVA</label>
        <input type="checkbox">
         <label>HTML</label>
        <input type="checkbox">
<br><br>
            <label>ADDRESS:</label>
            <textarea id="address" name="address" rows="1" cols="12"
            placeholder="enter your address"></textarea>
            <br><br>
<select>
          <label>select your branch</label>
     <option>CSE</option>
       <option>ECE</option>
  <option>DS</option>
    <option>AI/ML</option>
    </select>
    <br><br>
        
    <input type="submit" value="REGISTER"><br><br>
    <input type="reset" value="RESET">
    
    </fieldset>
    </FORM>

    
</body>
</html>
